name: Deploy demo to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'ci skip')"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 20.19
        uses: actions/setup-node@v7
        with:
          node-version: 20.19
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # Storybook loads the addon from ./dist, so build it before build-storybook.
      - name: Build addon
        run: pnpm build

      # Emits storybook-static/ including manifests/components.json (the manifest
      # Oversight lints), so the hosted demo shows real diagnostics.
      - name: Build Storybook
        run: pnpm build-storybook

      - name: Configure Pages
        uses: actions/configure-pages@v6

      # `include-hidden-files` because v4.0.0 started excluding dotfiles from the
      # tarball, and its `--exclude=.[^/]*` is unanchored, so it drops them at
      # every depth rather than only at the root. The current build has no
      # dotfiles among its 58 entries, so this changes nothing today; it is here
      # so that the day Vite emits `.vite/manifest.json`, or someone adds a
      # `.nojekyll` or a dot-prefixed `staticDirs` entry, the file reaches the
      # deploy. The failure it prevents is silent: upload green, deploy green, no
      # log line naming the omission, and the demo 404ing on a missing asset.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: storybook-static
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
