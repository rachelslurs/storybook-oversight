name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    steps:
      # GH_TOKEN is a PAT for @rachelslurs. The default GITHUB_TOKEN cannot push
      # past the main ruleset on a personal repo, and Changesets opens the
      # "Version Packages" PR as you.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 20.19
        uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # With changesets present, opens/updates a "Version Packages" PR that runs
      # `version`. Once that PR merges (versions bumped, changesets consumed),
      # runs `publish` to build and publish the changed packages to npm.
      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Kick the oversight-lint-action canary when this publish includes the CLI.
      # That repo pins the exact version from client_payload and retries npm until
      # the tarball is visible, so no fixed sleep here.
      - name: Notify oversight-lint-action
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail
          echo "$PUBLISHED" | jq -e 'map(.name) | index("oversight-lint")' >/dev/null || {
            echo "oversight-lint was not in this publish; skipping dispatch."
            exit 0
          }
          version=$(echo "$PUBLISHED" | jq -r '.[] | select(.name=="oversight-lint") | .version')
          echo "Dispatching oversight-lint-published for oversight-lint@$version"
          gh api repos/rachelslurs/oversight-lint-action/dispatches \
            -f event_type=oversight-lint-published \
            -f "client_payload[version]=$version"

      # `beta` froze behind `latest` when prerelease mode ended: changeset
      # publish passed --tag beta from .changeset/pre.json, and leaving pre mode
      # deleted that file. Anyone on `version: beta` then ran an older build
      # than the default and nothing said so. This keeps the tag from pointing
      # backwards again after the next prerelease cycle.
      #
      # Runs after Notify on purpose. The publish has already happened by the
      # time this can fail, so failing first would only withhold the dispatch
      # and leave the action's pin behind for a tagging problem.
      - name: Move beta to any stable release
        if: steps.changesets.outputs.published == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISHED: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          set -euo pipefail

          # No name filter: oversight-core is private, so publishedPackages only
          # ever holds the two published packages and both want the tag moved.
          # A version carrying a prerelease segment is not a stable release.
          stable=$(echo "$PUBLISHED" | jq -r '.[] | select(.version | test("-") | not) | "\(.name)@\(.version)"')
          if [[ -z "$stable" ]]; then
            echo "Nothing stable in this publish, so beta stays where it is."
            exit 0
          fi

          # NPM_TOKEN is scoped to the changesets step, so this needs its own
          # auth rather than whatever that step left behind.
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> "$HOME/.npmrc"

          for spec in $stable; do
            echo "Moving beta to $spec"
            npm dist-tag add "$spec" beta
          done

          for spec in $stable; do
            name=${spec%@*}
            echo "$name now: $(npm view "$name" dist-tags --json | jq -c .)"
          done
