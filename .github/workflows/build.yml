name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    if: "github.event_name == 'pull_request' || (!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci'))"
    strategy:
      matrix:
        node-version: [20.19, 22.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Check for linter errors
        run: pnpm lint

  build:
    runs-on: ubuntu-latest
    if: "github.event_name == 'pull_request' || (!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci'))"
    strategy:
      matrix:
        node-version: [20.19, 22.12]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # The same gate `pnpm release` runs before publishing. It is here as well
      # because it imports `storybook/internal/{manager,preview}/globals`, so a
      # Storybook major that moves those paths makes it throw at import. At
      # release-only cadence the first symptom would be a red release job after
      # the Version Packages PR had already merged.
      - name: Prepublish checks
        run: pnpm prepublish-checks

      - name: Build packages
        run: pnpm build

      # Reads dist/, so it has to follow the build. Its sibling above reads the
      # manifests and runs before one. publint and attw both inspect a real
      # `npm pack` tarball rather than the working tree.
      - name: Artifact checks
        run: pnpm artifact-checks

      # `pnpm build` typechecks the addon and CLI through their own tsc pass, and
      # skips oversight-core entirely because it has no build. This covers the
      # demo stories from the root tsconfig and then every package, including the
      # test files, which nothing else reads.
      - name: Typecheck
        run: pnpm typecheck

      # Runs before the demo build so a broken demo cannot hide a package
      # regression. These are the three node projects; the browser ones are two
      # steps down.
      #
      # Still after `pnpm build`: cli.test.ts drives packages/cli/dist/cli.js and
      # skips rather than fails when it is absent, so running tests earlier would
      # drop those 11 assertions without turning anything red.
      - name: Run unit tests
        run: pnpm test:unit

      # The `storybook` vitest project runs the demo's stories in headless
      # chromium. Only that browser is installed; the project names chromium and
      # nothing else, so pulling the other two would triple the download for
      # nothing. Cached on the resolved playwright version, since the binary
      # changes only when that devDependency moves.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # `--with-deps` installs system libraries outside the cached path, so it
      # runs either way; the browser download is what the cache skips.
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # `storybook build` directly rather than `pnpm build-storybook`, whose
      # `build:addon` would delete and rebuild the dist that `pnpm build` above
      # already produced. This is also where the components manifest the
      # docs-block story reads comes from.
      - name: Build Storybook
        run: pnpm exec storybook build

      # Reads storybook-static, so it has to follow the build above, and needs
      # the chromium installed two steps up. It covers the two surfaces nothing
      # else reaches. `@storybook/addon-vitest` pushes `**/*.mdx` into
      # `test.exclude` unconditionally, so `pnpm test:storybook` below cannot run
      # a Docs entry at any configuration; and story tests execute inside the
      # preview, so none of them can see the manager the panel renders into.
      - name: Check the built Storybook
        run: pnpm built-storybook-checks

      - name: Run story tests
        run: pnpm test:storybook

  # The `build` job above installs whatever the lockfile resolved, on React 18,
  # and nothing else. These two entries cover the declared peer floor and the
  # newer React major the README also promises, each on its own runner so a pin
  # failure in one cannot mask a pass in the other.
  #
  # The floor is read from the addon's `peerDependencies` rather than restated
  # here, and the print step below fails when the install does not match it. A
  # literal would go stale the moment the range moves, and a floor entry testing
  # a version the package no longer claims is worse than no floor entry: it is
  # green and it is wrong.
  #
  # It also pins the whole Storybook family and forces one version graph-wide,
  # because a partial pin can leave two copies of `@storybook/addon-docs`
  # resolved at once, and two copies mean two theme contexts and a blank Docs
  # page. That is #93, and reading the resulting failure as "the addon does not
  # support this version" is the mistake that produced the wrong peer range in
  # the first place. `@storybook/addon-vitest` is pinned along with the rest as
  # cheap insurance rather than because it is known to pull addon-docs in: it
  # declares no dependency on it at any version involved.
  compat:
    name: compat (${{ matrix.name }})
    runs-on: ubuntu-latest
    if: "github.event_name == 'pull_request' || (!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci'))"
    strategy:
      fail-fast: false
      matrix:
        include:
          # `floor` means "read the range out of the addon's package.json", on
          # the React major the lockfile already uses, so a failure here is about
          # the Storybook version and nothing else.
          - name: storybook-floor
            storybook: floor
            react: '18'
          # The middle of the declared range. The floor and the lockfile cover the
          # two ends and would both stay green while a minor in between broke, and
          # `0.6.1` tells consumers 10.4 works, so something has to keep saying so.
          # A literal is right here: this is a specific version, not a boundary that
          # moves with the metadata.
          - name: storybook-10-4
            storybook: '10.4.6'
            react: '18'
          # An empty `storybook` means "whatever the lockfile resolves". Naming a
          # version here instead would freeze this entry on it, and the job would
          # go on reporting a React 19 pass against a Storybook the repo had long
          # since moved off.
          - name: react-19
            storybook: ''
            react: '19'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Use Node.js 20.19
        uses: actions/setup-node@v7
        with:
          node-version: 20.19
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      # `pnpm.overrides`, not `pnpm add`. `pnpm add` sets the root's direct
      # dependencies and stops there, which leaves peer resolution free to
      # materialize a second `@storybook/addon-docs` under a workspace package
      # whose own peer range the pinned root no longer satisfies. Pinning four
      # packages by hand still produced a 10.5.0 nested beside the pinned 10.3.0,
      # and the duplicate check caught it. An override applies to the whole graph,
      # so the family collapses to one version and one copy.
      #
      # The runner is ephemeral, so rewriting package.json and the lockfile here
      # is thrown away with it.
      - name: Pin matrix versions
        id: pin
        run: |
          set -euo pipefail
          want='${{ matrix.storybook }}'
          if [[ "$want" == "floor" ]]; then
            # The declared range, minus its caret. Read here so the matrix and the
            # published metadata cannot disagree.
            want=$(node -p "require('./packages/storybook-addon-oversight/package.json').peerDependencies.storybook.replace(/^[^0-9]*/,'')")
            echo "Floor read from peerDependencies: $want"
          fi
          echo "storybook=$want" >> "$GITHUB_OUTPUT"

          # Overrides go in `pnpm-workspace.yaml`, which is where pnpm 10 reads them.
          # The `pnpm` field in package.json still applies today but pnpm already
          # warns that it is no longer read, and if a release makes that true the
          # devDependency edits alone would still satisfy a single-package check.
          # That is why the step below asserts the whole family.
          WANT="$want" REACT='${{ matrix.react }}' node -e "
            const fs = require('node:fs');
            const want = process.env.WANT;
            const react = process.env.REACT;

            const overrides = { react: '^' + react, 'react-dom': '^' + react };
            const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));

            if (want) {
              for (const name of ['storybook', '@storybook/react-vite', '@storybook/addon-docs', '@storybook/addon-vitest']) {
                overrides[name] = want;
                if (manifest.devDependencies[name]) manifest.devDependencies[name] = want;
              }
            }

            manifest.devDependencies.react = '^' + react;
            manifest.devDependencies['react-dom'] = '^' + react;
            fs.writeFileSync('package.json', JSON.stringify(manifest, null, 2) + '\n');

            // Appended rather than parsed: this file has no top-level \`overrides\`
            // key to merge with, and the runner is thrown away after the job.
            const block = Object.entries(overrides)
              .map(([name, range]) => '  ' + JSON.stringify(name) + ': ' + JSON.stringify(range))
              .join('\n');
            fs.appendFileSync('pnpm-workspace.yaml', '\noverrides:\n' + block + '\n');
            console.log('overrides:', JSON.stringify(overrides));
          "
          pnpm install --no-frozen-lockfile

      # Asserts, and does not merely print. The comment that used to sit here
      # called the print mandatory and then only echoed, which is the same green
      # log it warns about. A pin that failed to take now turns the job red on the
      # step that names it.
      - name: Check resolved versions
        run: |
          set -euo pipefail
          for pkg in storybook @storybook/react-vite @storybook/addon-docs \
            @storybook/addon-vitest @storybook/addon-mcp react react-dom; do
            echo "$pkg: $(node -p "require('$pkg/package.json').version")"
          done

          # The whole family, not just `storybook`. Pinning the family is the point,
          # and asserting one member would stay green if an override silently stopped
          # applying to the others: the devDependency edits alone would satisfy it.
          want='${{ steps.pin.outputs.storybook }}'
          if [[ -n "$want" ]]; then
            for pkg in storybook @storybook/react-vite @storybook/addon-docs @storybook/addon-vitest; do
              got=$(node -p "require('$pkg/package.json').version")
              [[ "$got" == "$want" ]] || { echo "::error::$pkg resolved $got, wanted $want"; exit 1; }
            done
          fi

          major=$(node -p "require('react/package.json').version.split('.')[0]")
          [[ "$major" == "${{ matrix.react }}" ]] || {
            echo "::error::react resolved major $major, wanted ${{ matrix.react }}"; exit 1;
          }

      - name: Build packages
        run: pnpm build

      # Same gate as the `build` job, same reason: it imports
      # `storybook/internal/{manager,preview}/globals`, exactly the paths a
      # Storybook major moves, so a floor or a newer major fails to import
      # right here instead of failing to render three steps down.
      - name: Prepublish checks
        run: pnpm prepublish-checks

      # Same trio as `build`, repeated because this matrix runs on its own
      # fresh runner with nothing cached yet. Still keyed on the resolved
      # playwright version; the pin step above never touches playwright.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build Storybook
        run: pnpm exec storybook build

      # No `pnpm test:storybook` here: `@storybook/addon-vitest` peers
      # `@vitest/browser-playwright@^4.0.0` at every version this matrix pins,
      # and this workspace does not have it, so the run would fail on peer
      # resolution for a reason that has nothing to do with the addon under
      # test. That is true of the current version too, not only older ones.
      #
      # The floor build also logs `Import "getService" will always be undefined`
      # from the manager bundle. That is correct at 10.3: the API arrived in 10.5
      # and `useOversightReport.ts` reads it indirectly so a bundler cannot
      # refuse the build, leaving the load fetch-only. Not a warning to fix.
      #
      # No `pnpm typecheck`
      # either: the react-19 entry pins `react@^19` over the workspace's
      # `@types/react@^18`, so a type error there would be grading the demo's
      # types, not this addon. This step is what actually exercises the pinned
      # versions, and it has to be the one that boots the manager: the React 19
      # crash `src/react-shim.ts` exists for happens in the manager bundle, so a
      # check confined to the preview iframe would pass while the panel was dead.
      - name: Check the built Storybook
        run: pnpm built-storybook-checks
